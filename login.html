<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login</title>
    <link rel="stylesheet" href="CSS/stylespro.css" >
</head>
<body>
    <article class="container">
        <form class="formulario" method="POST">
            <h2 class="tituloo">Iniciar Sesión</h2>

            <label class="letra" for="username">Username</label><br>
            <input class="casilla" type="text"  placeholder="Ingresa tu usuario" required><br>

            <label class="letra" for="password">Contraseña</label><br>
            <input class="casilla" type="password"  placeholder="Ingresa tu contraseña" required><br>

            <button class="boton" type="submit" class="boton-ingresar">Ingresar</button>
            
        </form>
    </article>
</body>
</html>
