<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- FRAMEWORK DE BOOTSTRAP -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- LIBRERIA DE ICONOS -->
      <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>

    <!-- FAVICON DE LA APLICACIÓN DE MATRICULA -->
     <link rel="shortcut icon" href="Imagenes/logosis2.ico" type="image/x-icon">

    <!-- HOJA DE ESTILOS  -->
     <link rel="stylesheet" href="CSS/stylespro.css" >


</head>
<body>
    <article class="container">
        <form class="formulario" id="formRegistro" class="formulario">
            <h2 class="tituloo">Registro de Nuevo Alumno</h2>
            <input class="casilla" type="text" id="regNombres" name="nombres" placeholder="Nombres" required>
            <input class="casilla" type="text" id="regApellidos" name="apellidos" placeholder="Apellidos" required>
            <input class="casilla" type="text" id="regDni" name="dni" placeholder="N° DNI (8 dígitos)" maxlength="8" required>
            <input class="casilla" type="email" id="regCorreo" name="correo" placeholder="Correo Electrónico" required>
            <input class="casilla" type="date" id="regNacimiento" name="nacimiento" required>
            
            <input class="casilla" type="text" id="apoNombres" name="apoNombres" placeholder="Nombres del Apoderado" required>
            <input class="casilla" type="text" id="apoCelular" name="apoCelular" placeholder="Celular del Apoderado" maxlength="9" required>
            
            <button class="boton" type="submit">Registrarse</button>
            <p id="mensajeRegistro" class="mensaje"></p>
        </form>

        <form id="formLogin" class="formulario" style="display:none;">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="logUsuario" placeholder="N° DNI o Usuario" required>
            <input type="password" id="logPassword" placeholder="Contraseña asignada" required>
            <button type="submit">Ingresar</button>
            <p id="mensajeLogin" class="mensaje"></p>   
        </form>
        <a href="login.html">
        <button class="boton" id="btnAlternarVista">Ya tengo cuenta / Iniciar Sesión</button>
        </a>
    </article>

    <!-- LIBRERIA JS DE BOOTSTRAP -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
